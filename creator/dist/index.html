<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="initial-scale=1,width=device-width"/><title>Tamaweb | Mod Creator</title><script>class SpriteElement extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: "open" });
                this.image = document.createElement("img");
                this.shadowRoot.appendChild(this.image);
                this.image.style['-webkit-user-drag'] = 'none'
            }
            updateImage() {
                const src = this.getAttribute("src");
                const width = this.getAttribute("width");
                const height = this.getAttribute("height");
                const index = this.getAttribute("index");
                const naturalWidth = this.getAttribute("naturalWidth") || this.image.naturalWidth || 64;
                const posX = this.getAttribute('pos-x') || 0;
                const posY = this.getAttribute('pos-y') || 0;
                this.image.src = src;
                this.image.width = width;
                this.image.height = height;
                const x = (index % (naturalWidth / width)) * width;
                const y = Math.floor(index / (naturalWidth / width)) * height;
                this.image.style.objectFit = "none";
                this.image.style.objectPosition = `-${x + posX}px -${y + posY}px`;
                this.image.style.imageRendering = 'pixelated';
            }
            connectedCallback() {
                this.updateImage();
            }
            attributeChangedCallback(name, oldValue, newValue) {
                this.updateImage();
            }
            static get observedAttributes() {
                return ["src", "width", "height", "index"];
            }
        }
        customElements.define("c-sprite", SpriteElement);</script><script defer="defer" src="bundle.js"></script></head><body><div id="root"></div><script src="https://autosam.github.io/Tamaweb/resources/data/CharacterDefinitions.js"></script><script src="https://autosam.github.io/Tamaweb/resources/data/SpriteDefinitions.js"></script><script src="dist/bundle.js"></script></body></html>
